name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # STAGE 1: CI (Build in the Cloud)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/ai-anime-recommender:latest

  # STAGE 2: CD (Deploy on the Local Robot)
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy to K3s Cluster (GitOps)
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment anime-recommender-deployment -n anime-recommender
