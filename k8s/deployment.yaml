apiVersion: v1
kind: Namespace
metadata:
  name: anime-recommender
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anime-recommender-deployment
  namespace: anime-recommender
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anime-recommender
  template:
    metadata:
      labels:
        app: anime-recommender
    spec:
      imagePullSecrets:
        - name: ghcr-api-key
      containers:
        - name: anime-recommender-container
          image: ghcr.io/mamunhabib/ai-anime-recommender:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: GROQ_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: anime-recommender-service
  namespace: anime-recommender
spec:
  type: LoadBalancer
  selector:
    app: anime-recommender
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8501
